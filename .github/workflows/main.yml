name: دانلود فایل دلخواه شما با نت ملی

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل مورد نظر'
        required: true
        type: string
      zip_password:
        description: 'رمز عبور برای فایل ZIP'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: پاکسازی فایل‌های قدیمی
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # حذف فایل‌های آرشیو از گیت و دیسک
          if ls archive.7z.* 1> /dev/null 2>&1; then
            git rm -f archive.7z.*
            git commit -m "Cleanup: Removing old archive files"
            git push
          fi
          rm -f archive.7z.*

      - name: نصب 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: دانلود فایل از لینک
        run: |
          curl -L --fail --retry 3 -o downloaded_file "${{ github.event.inputs.file_url }}"

      - name: ساخت آرشیو رمزدار چندتکه
        run: |
          7z a -p"${{ github.event.inputs.zip_password }}" -mhe=on -mx=3 -v95m "archive.7z" downloaded_file

      - name: حذف فایل اصلی
        run: rm -f downloaded_file

      - name: Commit و Push مرحله‌ای تکه‌ها
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          chunks=(archive.7z.*)
          total=${#chunks[@]}
          batch_size=10
          start=0
          
          while[ $start -lt $total ]; do
            end=$((start + batch_size - 1))[ $end -ge $total ] && end=$((total - 1))
            
            echo "Pushing chunks $start to $end ..."
            
            for i in $(seq $start $end); do
              git add "${chunks[$i]}"
            done
            
            git commit -m "Add chunks $((start+1))-$((end+1)) of $total"
            
            for attempt in {1..5}; do
              if git push; then
                echo "Push successful"
                break
              else
                echo "Push failed (attempt $attempt), retrying in 10 seconds..."
                sleep 10
              fi
            done
            
            start=$((end + 1))
            sleep 5
          done